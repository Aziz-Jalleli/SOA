

spring:
  application:
    name: Gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: OrderService
              uri: http://localhost:8081
              predicates:
                - Path=/orders/**
            - id: KitchenService
              uri: http://localhost:8082
              predicates:
                - Path=/tickets/**
            - id: RestaurantService
              uri: http://localhost:8085
              predicates:
                - Path=/restaurants/**
            - id: CourtierService
              uri: http://localhost:8084
              predicates:
                - Path=/courtiers/**
            - id: deliveries
              uri: http://localhost:8086
              predicates:
                - Path=/deliveries/**
server:
  port: 9090
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
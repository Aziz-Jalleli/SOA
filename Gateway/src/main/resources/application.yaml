

spring:
  application:
    name: Gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: OrderService
              uri: http://localhost:8081
              predicates:
                - Path=/orders/**
            - id: KitchenService
              uri: http://localhost:8082
              predicates:
                - Path=/tickets/**
server:
  port: 9090
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}